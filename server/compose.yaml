# Runs on the homelab Docker host (`docker compose up -d --build`).
# .env holds HA_URL, HA_TOKEN, HB_URL, HB_USER, HB_PASS, CALENDARS; config.json is the private config. Neither is in git.
services:
  kindle-dashboard:
    build: .
    image: kindle-dashboard:latest
    restart: unless-stopped
    ports:
      - "10060:8080"
    env_file: .env
    environment:
      TZ: Asia/Ho_Chi_Minh
      CONFIG: /app/config.json
    volumes:
      - ./config.json:/app/config.json:ro
    # node:slim has no curl. /healthz is 503 when the browser is down or no source answered in 10 min.
    # Plain Docker only marks the container unhealthy; it does not restart it.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
